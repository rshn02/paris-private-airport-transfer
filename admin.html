<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Administrator Sign In | Paris Private Airport Transfer</title>
    <link rel="stylesheet" href="css/reservation.css">
    <style>
        .admin-login-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #141414; }
        .admin-login-card { width: min(100%, 420px); padding: 2rem; border: 1px solid rgba(201,169,97,.45); border-radius: 16px; background: #1d1d1d; color: #fff; }
        .admin-login-card h1 { margin-top: 0; color: #c9a961; font-size: 1.7rem; }
        .admin-login-card label { display: block; margin: 1rem 0 .45rem; }
        .admin-login-card input { width: 100%; box-sizing: border-box; padding: .8rem; border: 1px solid #666; border-radius: 8px; }
        .admin-login-card button { width: 100%; margin-top: 1.4rem; padding: .85rem; border: 0; border-radius: 8px; background: #c9a961; color: #151515; font-weight: 700; cursor: pointer; }
        .admin-login-status { min-height: 1.3rem; margin: 1rem 0 0; color: #f1c5c5; }
    </style>
</head>
<body class="admin-login-page">
    <main class="admin-login-card">
        <h1>Administrator Sign In</h1>
        <p>Use your Supabase administrator account. This access is verified again by the backend.</p>
        <form id="adminLoginForm">
            <label for="adminEmail">Email</label>
            <input id="adminEmail" type="email" autocomplete="username" required>
            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p id="adminLoginStatus" class="admin-login-status" role="status"></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/admin-login.js" defer></script>
</body>
</html>
